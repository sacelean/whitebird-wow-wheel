name: Publish manually verified wheel documentation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      deployed_revision:
        description: Full SHA deployed in Discord and described by docs/knowledge.json
        type: string
        required: true
      verified:
        description: I verified deployment and documentation match this revision
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: wheel-knowledge-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/publish-knowledge.mjs --validate
      - run: node --test scripts/check-knowledge.mjs
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verified
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish manually verified documentation in this repository
        env:
          DEPLOYED_REVISION: ${{ inputs.deployed_revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-knowledge.mjs
